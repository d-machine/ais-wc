<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components Demo</title>
    <script type="module" src="/src/app-element.ts"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        background-color: #f8f8f8;
      }

      * {
        box-sizing: border-box;
      }
      
      .container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: auto;
      }

      .parent {
        display: grid;
        grid-template-columns: repeat(auto-fill, 20px);
      }

      .child {
        margin: 5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        border-radius: 4px;
        gap: 10px;
      }

      /* .parent > .child:nth-child(even) {
        background-color: #f0f0f0;
      }
      .parent > .child:nth-child(odd) {
        background-color: #e0e0e0;
      } */

      /* Individual child spans */
      .child1 { grid-column: span 10; }
      .child2 { grid-column: span 10; }
      .child3 { grid-column: span 10; }
      .child4 { grid-column: span 10; }
      .child5 { grid-column: span 5; justify-content: center; }
      .child6 { grid-column: span 20; }
      .child7 { grid-column: span 10; }
      .child8 { grid-column: span 20; }
      .child9 { grid-column: span 20; }
      .child10 { grid-column: span 20; }
      .child11 { grid-column: span 10; }
      .child12 { grid-column: span 10; }
      .child13 { grid-column: span 10; }
      .child14 { grid-column: span 10; }
      .child15 { grid-column: span 10; }

      .input {
        max-width: 100%;
      }

      .input-1 {
        width: 100px;
      }

      .input-2 {
        width: 100px;
      }

      .input-3 {
        width: 100px;
      }

      .input-4 {
        width: 100px;
      }

      .input-5 {
        width: 50px;
      }

      .input-6 {
        width: 300px;
      }

      .input-7 {
        width: 100px;
      }

      .input-8 {
        width: 300px;
      }

      .input-9 {
        width: 300px;
      }

      .input-10 {
        width: 300px;
      }

      .input-11 {
        width: 100px;
      }

      .input-12 {
        width: 100px;
      }

      .input-13 {
        width: 100px;
      }

      .input-14 {
        width: 100px;
      }

      .input-15 {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="parent">
        <div class="child child1">
            <label>Ent No</label>
            <input class="input input-1" type="text" />
        </div>
        <div class="child child2">
            <label>Ent Date</label>
            <input class="input input-2" type="text" />
        </div>
        <div class="child child3">
            <label>Challan No</label>
            <input class="input input-3" type="text" />
        </div>
        <div class="child child4">
            <label>Challan Dt</label>
            <input class="input input-4" type="text" />
        </div>
        <div class="child child5">
            <button class="input input-5">Log</button>
        </div>
        <div class="child child6">
            <label>Process</label>
            <input class="input input-6" type="text" />
        </div>
        <div class="child child7">
            <label>Lot No</label>
            <input class="input input-7" type="text" />
        </div>
        <div class="child child8">
            <label>Party</label>
            <input class="input input-8" type="text" />
        </div>
        <div class="child child9">
            <label>Godown</label>
            <input class="input input-9" type="text" />
        </div>
        <div class="child child10">
            <label>Transport</label>
            <input class="input input-10" type="text" />
        </div>
        <div class="child child11">
            <label>Lrno.</label>
            <input class="input input-11" type="text" />
        </div>
        <div class="child child12">
            <label>Lrdt.</label>
            <input class="input input-12" type="text" />
        </div>
        <div class="child child13">
            <label>Something</label>
            <input class="input input-13" type="text" />
        </div>
        <div class="child child14">
            <label>Shade</label>
            <input class="input input-14" type="text" />
        </div>
        <div class="child child15">
            <label>Color</label>
            <input class="input input-15" type="text" />
        </div>
      </div>
    </div>
  </body>
</html>
