<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InputText Component with Default Value</title>
  <script type="module" src="./src/components/DepartmentSelect.js"></script>
  <script type="module" src="./src/components/TextInput.js"></script>
  <script type="module" src="./src/components/Button.js"></script>
</head>
<body>
  <h1>Input Text Component</h1>

  <input-text
  label="First Name"
  placeholder="Enter First Name"
  name="firstName"
  input-type="text"
  input-width="300px"
  label-width="120px"
  gap="12px"
  top="20px"
  left="10px"
></input-text>

<input-text
  label="Last Name"
  placeholder="Enter Last Name"
  name="lastname"
  input-type="text"
  input-width="300px"
  label-width="120px"
  gap="52px"
  top="10px"
  left="210px"
></input-text>

<input-text
  label="User Name"
  placeholder="Enter User Name"
  name="username"
  input-type="text"
  input-width="300px"
  label-width="120px"
  gap="102px"
  top="10px"
  left="410px"
></input-text>

<submit-button
  label="Submit"
  positionTop="160px"
  positionLeft="500px"
  id="submitButton"
></submit-button>

<script>
  document.getElementById('submitButton').addEventListener('click', () => {
    // Get all input-text elements
    const inputElements = document.querySelectorAll('input-text');
    
    const formData = {};

    // Iterate over each input-text component
    inputElements.forEach(input => {
      const label = input.inputLabel; // Get the label of the input
      const value = input.inputValue; // Get the value of the input

      // Add the label-value pair to formData
      formData[label] = value;
    });

    // Log the formData object
    console.log(formData);
  });
</script>

</body>
</html>
