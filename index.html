<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InputText Component with Default Value</title>
  <script type="module" src="./src/components/DepartmentSelect.js"></script>
  <script type="module" src="./src/components/TextInput.js"></script>
  <script type="module" src="./src/components/Button.js"></script>
</head>
<body>
  <h1>Input Text Component</h1>

  <input-text
  label="First Name"
  placeholder="Enter First Name"
  name="firstName"
  inputType="text"
  inputWidth="300px"
  labelWidth="120px"
  componentWidth="200px"
  gap="12px"
  top="20px"
  left="10px"
></input-text>

<input-text
  label="Last Name"
  placeholder="Enter Last Name"
  name="lastname"
  inputType="text"
  inputWidth="300px"
  labelWidth="120px"
  componentWidth="300px"
  gap="52px"
  top="10px"
  left="210px"
></input-text>


<department-selector componentWidth="500px" readonly></department-selector>


<department-selector componentWidth="500px"></department-selector>

<input-text
  label="User Name"
  placeholder="Enter User Name"
  name="username"
  inputType="text"
  inputWidth="300px"
  labelWidth="120px"
  componentWidth="500px"
  gap="20px"
  top="10px"
  left="10px"
></input-text>

<submit-button
  label="Submit"
  positionTop="160px"
  positionLeft="500px"
  id="submitButton"
></submit-button>

<script>
  document.getElementById('submitButton').addEventListener('click', () => {
    const inputElements = document.querySelectorAll('input-text');
    
    const formData = {};
    inputElements.forEach(input => {
      const label = input.inputLabel; 
      const value = input.inputValue; 
      formData[label] = value;
    });
    console.log(formData);
  });
</script>

</body>
</html>
